<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renan &amp; Tainara — Save the Date</title>
<meta name="description" content="Renan e Tainara vão se casar em 9 de julho de 2027. Guarde essa data.">
<meta name="theme-color" content="#fbf8f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Homemade+Apple&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #fbf8f0; /* mesma cor do fundo do vídeo do cachorrinho */
    --moldura: #d6d7cf;
    --verde: #1d3a2b;
    --tinta: #111111;
    --vermelho: #a8231d;
    --suave: cubic-bezier(.22, 1, .36, 1);
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--papel);
    color: var(--verde);
    font-family: "Cormorant Garamond", Garamond, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Textura leve de papel */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0; display: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- Moldura desenhada à mão ---------- */
  .moldura { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #moldura-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .traco { fill: none; stroke: var(--moldura); stroke-linecap: round; stroke-linejoin: round; }

  .coracao-canto {
    position: absolute; width: clamp(38px, 3.6vw, 70px); height: auto; overflow: visible;
    opacity: 0; transform: scale(.7) rotate(var(--giro, 0deg));
    animation: aparecerCanto 1.1s var(--suave) forwards, balanco 7s ease-in-out infinite;
  }
  .coracao-canto path { fill: none; stroke: var(--moldura); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .cc1 { --giro: -8deg; animation-delay: 1.5s, 2.6s; }
  .cc2 { --giro:  8deg; animation-delay: 1.65s, 3.4s; }
  .cc3 { --giro: -6deg; animation-delay: 1.8s, 3.0s; }
  .cc4 { --giro:  6deg; animation-delay: 1.95s, 3.8s; }

  @keyframes aparecerCanto { to { opacity: 1; transform: scale(1) rotate(var(--giro, 0deg)); } }
  @keyframes balanco {
    0%, 100% { transform: scale(1) rotate(var(--giro, 0deg)); }
    50%      { transform: scale(1.04) rotate(calc(var(--giro, 0deg) * -0.4)); }
  }

  /* ---------- Conteúdo ---------- */
  main {
    position: relative; z-index: 2;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    text-align: center;
    padding: calc(var(--margem-baixo) + clamp(40px, 8vh, 100px) + env(safe-area-inset-top, 0px)) 28px calc(var(--margem-baixo) + 20px + env(safe-area-inset-bottom, 0px));
  }

  .entra { opacity: 0; transform: translateY(14px); filter: blur(6px); animation: entrar 1.2s var(--suave) forwards; }
  @keyframes entrar { to { opacity: 1; transform: none; filter: blur(0); } }

  /* Save the Date! */
  .lettering { position: relative; margin: 0 0 clamp(26px, 4vh, 48px); animation-delay: .5s; }
  .lettering img { display: none; width: clamp(190px, 12.5vw, 240px); height: auto; }
  .lettering.com-imagem img { display: block; }
  .lettering.com-imagem .escrita { display: none; }
  .escrita {
    font-family: "Homemade Apple", "Brush Script MT", cursive; font-weight: 400;
    color: var(--verde); line-height: 1.05; margin: 0; transform: rotate(-6deg);
    font-size: clamp(1.9rem, 2.6vw, 3.1rem);
    clip-path: inset(0 100% 0 0); animation: escrever 2s .7s var(--suave) forwards;
  }
  .escrita span { display: block; }
  .escrita span + span { padding-left: 1.3em; }
  .escrita svg { width: .9em; height: .9em; vertical-align: -0.05em; margin-left: .05em; }
  @keyframes escrever { to { clip-path: inset(-20% -10% -20% -10%); } }

  h1 {
    font-family: "Source Serif 4", Georgia, serif; font-weight: 600; color: var(--tinta);
    font-size: clamp(1.9rem, 2.3vw, 2.75rem); letter-spacing: -.005em; margin: 0 0 clamp(22px, 3.4vh, 40px);
    animation-delay: 1.35s;
  }

  .italico {
    font-style: italic; font-weight: 500; letter-spacing: .06em;
    font-size: clamp(1.2rem, 1.45vw, 1.7rem); margin: 0; line-height: 1.35; text-wrap: balance;
  }
  .l1 { animation-delay: 1.65s; }

  .divisor { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 8px; animation-delay: 1.9s; }
  .divisor i { display: block; height: 2px; width: 34px; background: var(--verde); transform: scaleX(0); animation: linha 1s 2.1s var(--suave) forwards; }
  .divisor i:first-child { transform-origin: right; }
  .divisor i:last-child  { transform-origin: left; }
  @keyframes linha { to { transform: scaleX(1); } }
  .divisor svg { width: 22px; height: 22px; overflow: visible; animation: bater 4s 3.4s ease-in-out infinite; }
  .divisor svg path, .escrita svg path { fill: none; stroke: var(--vermelho); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes bater { 0%, 70%, 100% { transform: scale(1); } 78% { transform: scale(1.18); } 86% { transform: scale(.96); } 92% { transform: scale(1.08); } }

  .data {
    font-weight: 600; text-transform: uppercase; color: var(--verde); margin: 4px 0 2px;
    font-size: clamp(1.05rem, 1.25vw, 1.45rem); letter-spacing: .32em; padding-left: .32em;
    animation: entrarData 1.4s 2.15s var(--suave) forwards;
    opacity: 0; filter: blur(6px);
  }
  @keyframes entrarData { from { letter-spacing: .5em; } to { opacity: 1; filter: blur(0); letter-spacing: .32em; } }
  .l2 { animation-delay: 2.4s; }

  /* Botão Salvar na agenda */
  .agenda { margin-top: clamp(22px, 3.4vh, 36px); animation-delay: 2.6s; }
  .agenda a {
    display: inline-flex; align-items: center; gap: .6em;
    font-family: "Cormorant Garamond", Garamond, serif; font-weight: 600;
    font-size: clamp(1rem, 1.1vw, 1.2rem); letter-spacing: .14em; text-transform: uppercase;
    color: var(--verde); text-decoration: none;
    padding: .85em 1.9em; border: 1.5px solid var(--verde); border-radius: 999px;
    background: var(--papel);
    transition: background .5s var(--suave), color .5s var(--suave), transform .5s var(--suave), box-shadow .5s var(--suave);
  }
  .agenda a svg { width: 1.15em; height: 1.15em; flex: none; }
  .agenda a svg * { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .agenda a svg .cor { stroke: var(--vermelho); transition: stroke .5s var(--suave); }
  .agenda a:hover, .agenda a:focus-visible {
    background: var(--verde); color: var(--papel);
    transform: translateY(-2px); box-shadow: 0 10px 24px -12px rgba(29, 58, 43, .55);
  }
  .agenda a:hover svg .cor, .agenda a:focus-visible svg .cor { stroke: #f1b3ae; }
  .agenda a:focus-visible { outline: 2px solid var(--vermelho); outline-offset: 4px; }
  .agenda a:active { transform: translateY(0); }

  /* Cachorrinho grande ATRÁS dos textos, ocupando a parte de baixo da moldura.
     Como o fundo do vídeo tem a mesma cor da página, os textos ficam por cima sem problema. */
  :root { --margem-baixo: 60px; --margem-lado: 60px; }
  main > *:not(.cachorro) { position: relative; z-index: 1; }
  .cachorro {
    position: absolute; z-index: 0; pointer-events: none;
    left: calc(var(--margem-lado) + 12px); right: calc(var(--margem-lado) + 12px);
    bottom: calc(var(--margem-baixo) + 8px + env(safe-area-inset-bottom, 0px));
    height: 64%;
    display: flex; justify-content: center; align-items: flex-end;
    animation-delay: 2.7s;
  }
  .cachorro video {
    display: block; height: 100%; width: auto; max-width: 100%;
    object-fit: contain; object-position: center bottom;
    background: var(--papel);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent), linear-gradient(to bottom, transparent, #000 8%, #000 96%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent), linear-gradient(to bottom, transparent, #000 8%, #000 96%, transparent);
    mask-composite: intersect;
  }

  @media (max-width: 640px) {
    .cachorro { height: 55%; }
    main { padding-left: 34px; padding-right: 34px; }
    .italico { letter-spacing: .03em; }
    .data { letter-spacing: .22em; padding-left: .22em; }
    @keyframes entrarData { from { letter-spacing: .4em; } to { opacity: 1; filter: blur(0); letter-spacing: .22em; } }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    .escrita { clip-path: none; }
  }
</style>
</head>
<body>

<div class="moldura" aria-hidden="true">
  <svg id="moldura-svg">
    <defs>
      <filter id="aspero" x="-2%" y="-2%" width="104%" height="104%">
        <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="ruido"/>
        <feDisplacementMap in="SourceGraphic" in2="ruido" scale="3.5"/>
      </filter>
    </defs>
    <g filter="url(#aspero)">
      <path class="traco" id="traco1" stroke-width="10" opacity=".85"/>
      <path class="traco" id="traco2" stroke-width="5" opacity=".5"/>
    </g>
  </svg>
  <!-- Corações dos cantos -->
  <svg class="coracao-canto cc1" viewBox="0 0 60 80"><path d="M30 24 C27 8 6 6 7 22 C8 38 24 56 30 74 C36 56 52 38 53 22 C54 6 33 8 30 24"/></svg>
  <svg class="coracao-canto cc2" viewBox="0 0 60 80"><path d="M30 24 C27 8 6 6 7 22 C8 38 24 56 30 74 C36 56 52 38 53 22 C54 6 33 8 30 24"/></svg>
  <svg class="coracao-canto cc3" viewBox="0 0 60 80"><path d="M30 24 C27 8 6 6 7 22 C8 38 24 56 30 74 C36 56 52 38 53 22 C54 6 33 8 30 24"/></svg>
  <svg class="coracao-canto cc4" viewBox="0 0 60 80"><path d="M30 24 C27 8 6 6 7 22 C8 38 24 56 30 74 C36 56 52 38 53 22 C54 6 33 8 30 24"/></svg>
</div>

<main>
  <div class="lettering entra" id="lettering">
    <!-- Se tiver a arte original do "Save the Date!", salve como save-the-date.png
         na mesma pasta deste arquivo: ela é usada automaticamente no lugar da fonte. -->
    <img src="save-the-date.png" alt="Save the Date!"
         onload="document.getElementById('lettering').classList.add('com-imagem')"
         onerror="this.remove()">
    <p class="escrita" aria-label="Save the Date!">
      <span>Save the</span>
      <span>Date!<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8 C11 4 5 3 4.5 7.5 C4 12 9 16 12 21 C15 16 20 12 19.5 7.5 C19 3 13 4 12 8 M10 17 L13.5 22"/></svg></span>
    </p>
  </div>

  <h1 class="entra">Tainara &amp; Renan</h1>

  <p class="italico l1 entra">Tem um dia muito especial chegando.</p>

  <div class="divisor entra" aria-hidden="true">
    <i></i>
    <svg viewBox="0 0 24 24"><path d="M12 8 C11 4 5 3 4.5 7.5 C4 12 9 16 12 21 C15 16 20 12 19.5 7.5 C19 3 13 4 12 8"/></svg>
    <i></i>
  </div>

  <p class="data">9 de julho de 2027</p>

  <p class="italico l2 entra">Guarde essa data para celebrar com a gente.</p>

  <div class="agenda entra">
    <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Casamento%20Tainara%20%26%20Renan&amp;dates=20270709%2F20270710&amp;location=Av.%20Cel.%20Sezefredo%20Fagundes%2C%207505%20-%20Jardim%20das%20Pedras%2C%20S%C3%A3o%20Paulo%20-%20SP&amp;details=Guarde%20essa%20data%20para%20celebrar%20com%20a%20gente!%20Mais%20detalhes%20em%20breve.%0A%0Ahttps%3A%2F%2Frenandamazio.com.br%2FTainaraCustodio%2F"
       target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="15" rx="2.5"/>
        <path d="M3.5 9.5h17M8 3v4M16 3v4"/>
        <path class="cor" d="M12 13.2c-.5-1.4-2.6-1.5-2.8.1-.2 1.3 1.6 2.6 2.8 3.7 1.2-1.1 3-2.4 2.8-3.7-.2-1.6-2.3-1.5-2.8-.1"/>
      </svg>
      Salvar na agenda
    </a>
  </div>

  <div class="cachorro entra">
    <video src="https://res.cloudinary.com/p48prprp/video/upload/f_mp4/v1790345118/cachorrinho.mp4"
           autoplay muted loop playsinline preload="auto" aria-label="Cachorrinho"></video>
  </div>
</main>

<script>
(function () {
  /* Desenha a moldura com traço irregular, como feita à mão, no tamanho da tela */
  var svg = document.getElementById('moldura-svg');
  var t1 = document.getElementById('traco1');
  var t2 = document.getElementById('traco2');
  var reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var jaAnimou = false;

  function aleatorio(semente) {
    return function () { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; };
  }

  function retanguloTorto(w, h, mx, my, semente, tremor) {
    var r = aleatorio(semente), pts = [], passo = 38;
    var cantos = [[mx, my], [w - mx, my], [w - mx, h - my], [mx, h - my], [mx, my]];
    for (var c = 0; c < 4; c++) {
      var a = cantos[c], b = cantos[c + 1];
      var dist = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(2, Math.round(dist / passo));
      for (var i = 0; i < n; i++) {
        var k = i / n;
        pts.push([a[0] + (b[0] - a[0]) * k + (r() - .5) * tremor, a[1] + (b[1] - a[1]) * k + (r() - .5) * tremor]);
      }
    }
    pts.push(pts[0]);
    var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (var j = 1; j < pts.length; j++) {
      var mxp = (pts[j - 1][0] + pts[j][0]) / 2, myp = (pts[j - 1][1] + pts[j][1]) / 2;
      d += ' Q' + pts[j - 1][0].toFixed(1) + ' ' + pts[j - 1][1].toFixed(1) + ' ' + mxp.toFixed(1) + ' ' + myp.toFixed(1);
    }
    return d + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + pts[pts.length - 1][1].toFixed(1);
  }

  function posicionarCoracoes(mx, my) {
    var cs = document.querySelectorAll('.coracao-canto'), gap = Math.max(18, Math.min(34, window.innerWidth * .018));
    var p = [
      { left: mx + gap, top: my + gap }, { right: mx + gap, top: my + gap },
      { left: mx + gap, bottom: my + gap }, { right: mx + gap, bottom: my + gap }
    ];
    cs.forEach(function (el, i) {
      el.style.left = el.style.right = el.style.top = el.style.bottom = '';
      Object.keys(p[i]).forEach(function (k) { el.style[k] = p[i][k] + 'px'; });
    });
  }

  function desenhar() {
    var w = window.innerWidth, h = window.innerHeight;
    var mx = Math.max(16, Math.min(95, w * .05)), my = Math.max(20, Math.min(70, h * .063));
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    t1.setAttribute('d', retanguloTorto(w, h, mx, my, 7, 5));
    t2.setAttribute('d', retanguloTorto(w, h, mx + 1.5, my - 1, 19, 7));
    posicionarCoracoes(mx, my);
    document.documentElement.style.setProperty('--margem-baixo', my + 'px');
    document.documentElement.style.setProperty('--margem-lado', mx + 'px');

    if (!jaAnimou && !reduzir) {
      jaAnimou = true;
      [t1, t2].forEach(function (p, i) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        p.getBoundingClientRect();
        p.style.transition = 'stroke-dashoffset ' + (2.4 + i * .3) + 's cubic-bezier(.65,0,.35,1) ' + (.15 + i * .25) + 's';
        p.style.strokeDashoffset = 0;
        p.addEventListener('transitionend', function () { p.style.strokeDasharray = 'none'; }, { once: true });
      });
    } else {
      [t1, t2].forEach(function (p) { p.style.transition = 'none'; p.style.strokeDasharray = 'none'; p.style.strokeDashoffset = 0; });
    }
  }

  var espera;
  window.addEventListener('resize', function () { clearTimeout(espera); espera = setTimeout(desenhar, 120); });
  desenhar();

  /* Garante o vídeo tocando no celular */
  var v = document.querySelector('.cachorro video');
  if (v) { var tocar = v.play(); if (tocar && tocar.catch) tocar.catch(function () {}); }
})();
</script>
</body>
</html>
