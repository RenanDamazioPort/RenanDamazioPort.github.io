<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F5EE">
<meta name="description" content="Tainara e Renan vão se casar em 9 de julho de 2027. Guarde essa data para celebrar com a gente.">
<title>Tainara & Renan — Save the date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#F8F5EE;--green:#334C3A;--red:#A13D36}*{box-sizing:border-box}html{min-height:100%;background:var(--paper)}body{margin:0;color:var(--green);font-family:"DM Sans",Arial,sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:28px}.card{position:relative;width:min(100%,850px);min-height:min(780px,calc(100svh - 56px));padding:clamp(38px,7vw,76px) clamp(25px,8vw,92px);border:1px solid rgba(51,76,58,.48);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}.card:before{content:"";position:absolute;inset:9px;border:1px solid rgba(51,76,58,.18);pointer-events:none}.eyebrow{font-size:12px;line-height:1.5;letter-spacing:.23em;text-transform:uppercase;font-weight:600}.heart{color:var(--red);font-size:37px;line-height:1;transform:rotate(-12deg);font-family:Georgia,serif}.middle{padding:44px 0}.save{font-family:"Italiana",Georgia,serif;font-size:clamp(25px,5vw,41px);font-style:italic;line-height:1.2}.names{font-family:"Italiana",Georgia,serif;font-weight:400;font-size:clamp(70px,13vw,152px);letter-spacing:-.055em;line-height:.81;margin:28px 0 36px}.names span{display:block}.names em{display:block;color:var(--red);font-size:.48em;font-style:normal;line-height:1.25;letter-spacing:0}.message{font-size:clamp(15px,2vw,18px);line-height:1.65;max-width:390px;margin:0 auto}.date{font-family:"Italiana",Georgia,serif;font-size:clamp(30px,6vw,56px);line-height:1.1;margin:0 0 14px}.footnote{font-size:13px;letter-spacing:.04em;line-height:1.5;margin:0}@media(max-width:520px){main{padding:12px}.card{min-height:calc(100svh - 24px);padding:38px 22px}.card:before{inset:6px}.middle{padding:32px 0}.names{margin:25px 0 30px}}
</style>
</head>
<body>
<main>
<article class="card" aria-label="Save the date de Tainara e Renan">
<div class="eyebrow">Um dia para guardar no coração</div>
<div class="middle"><div class="heart" aria-hidden="true">♡</div><p class="save">save the date</p><h1 class="names"><span>Tainara</span><em>&amp;</em><span>Renan</span></h1><p class="message">Tem um dia muito especial chegando. Guarde essa data para celebrar com a gente.</p></div>
<div><p class="date"><time datetime="2027-07-09">9 de julho de 2027</time></p><p class="footnote">Convite e detalhes em breve.</p></div>
</article>
</main>
</body>
</html>
